<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="/assets/favicon.png?v=1"><title>Central de ligações | Entrar</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#1d2b32;background:#17443a}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(#112a2926,#112a294d),url('/assets/login-landscape.png?v=2') center/cover no-repeat fixed}button,input{font:inherit}.card{width:min(400px,100%);min-height:400px;background:#fffffff5;padding:40px;border-radius:4px;box-shadow:0 20px 65px #081e2945;border:1px solid #ffffff80}h1{margin:0 0 8px;font-size:23px;font-weight:750;letter-spacing:-.6px;text-align:center}.intro{font-size:12px;color:#73818a;text-align:center;margin:0 0 28px}label{display:block;font-size:12px;font-weight:650;margin:18px 0 8px}input{width:100%;border:1px solid #d7e0e3;border-radius:5px;padding:12px;font-size:13px;background:#fff;outline:none}input:focus{border-color:#168d73;box-shadow:0 0 0 3px #168d7312}.password{position:relative}.password input{padding-right:75px}.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:#72838a;font-size:11px;padding:6px;cursor:pointer}.submit{margin-top:25px;width:100%;padding:13px;background:#087e65;color:#fff;font-size:13px;font-weight:700;border:0;border-radius:5px;cursor:pointer}.submit:hover{background:#076a56}.submit:disabled{opacity:.65;cursor:wait}.error{margin-top:16px;padding:10px;background:#fff0f1;color:#a32635;border-radius:5px;font-size:12px;line-height:1.5}button:focus-visible{outline:3px solid #66bfae;outline-offset:3px}@media(max-width:480px){body{padding:18px}.card{padding:30px 25px;min-height:380px}h1{font-size:22px}}
</style></head><body><main class="card"><h1>Central de ligações</h1><p class="intro">Entre com seu usuário e senha.</p><form id="loginForm"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" maxlength="256" placeholder="Seu usuário" required autofocus><label for="password">Senha</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" placeholder="Sua senha" required><button type="button" class="toggle" id="togglePassword" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></div><div id="error" class="error" role="alert" hidden></div><button type="submit" class="submit" id="submitLogin">Entrar</button></form></main>
<script>
const password=document.getElementById('password'),toggle=document.getElementById('togglePassword');toggle.onclick=()=>{const visible=password.type==='password';password.type=visible?'text':'password';toggle.textContent=visible?'Ocultar':'Mostrar';toggle.setAttribute('aria-label',visible?'Ocultar senha':'Mostrar senha');toggle.setAttribute('aria-pressed',String(visible))};
document.getElementById('loginForm').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('submitLogin'),error=document.getElementById('error');error.hidden=true;button.disabled=true;button.textContent='Entrando...';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(15000),body:JSON.stringify({username:document.getElementById('username').value,password:password.value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Não foi possível entrar.');password.value='';location.replace('/')}catch(failure){error.textContent=failure.name==='TimeoutError'?'O servidor demorou a responder. Tente novamente.':failure.message;error.hidden=false}finally{button.disabled=false;button.textContent='Entrar'}};
</script></body></html>

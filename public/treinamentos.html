<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treinamentos | Central de ligações</title><link rel="icon" href="/assets/favicon.png?v=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#18334c;font:14px system-ui}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #dfe6ef;padding:20px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;gap:18px}header a{color:#128d79;text-decoration:none;font-weight:650}header span{margin-left:auto;font-size:13px;color:#687c91}main{max-width:1250px;margin:28px auto;padding:0 24px}.intro h1{margin:0;font-size:30px}.intro p{color:#687c91;max-width:650px;line-height:1.6}.training-filters{display:flex;gap:12px;margin:24px 0;align-items:center;flex-wrap:wrap}.training-filters input,.training-filters select{padding:12px;border:1px solid #dce3ed;border-radius:8px;background:white}.training-filters input{flex:1;min-width:210px}.training-filters small{color:#687c91}.training-page-panel{position:static;padding:0;background:none}.hub-head h2,.hub-close{display:none}.hub-toolbar,.hub-actions{display:flex;gap:8px;margin:14px 0}.btn,.ico{border:1px solid #dce3ed;border-radius:7px;background:#fff;color:#254762;padding:9px 14px}.primary{background:#098d75;color:white;border-color:#098d75}.hub-status{color:#ad3d45;white-space:pre-wrap}.hub-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}.hub-card{background:#fff;border:1px solid #e0e7ef;border-radius:12px;padding:18px;box-shadow:0 4px 18px #18334c06;display:flex;flex-direction:column;align-items:flex-start}.hub-card strong{font-size:17px;margin:12px 0 0}.hub-card p{color:#687c91;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.hub-card small{color:#168b74}.product-badge{border-radius:5px;background:#ede8fb;color:#7050a9;padding:5px 10px;font-size:11px;font-weight:700}.hub-video-preview{position:relative;width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:linear-gradient(135deg,#233952,#7056a8);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;overflow:hidden;margin:14px 0}.hub-video-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.65}.hub-video-preview svg,.hub-video-preview span{position:relative;filter:drop-shadow(0 1px 3px #000)}.hub-video-preview svg{width:38px;height:38px}.hub-player{background:#162638;border-radius:12px;overflow:hidden;margin:20px auto;max-width:1000px;color:#fff;scroll-margin-top:24px}.hub-player-head{display:flex;align-items:center;gap:8px;padding:14px}.hub-player-head strong{flex:1;overflow-wrap:anywhere}.hub-player-head .ico{color:white;background:#ffffff20;border:0}.hub-player-head svg{width:18px;height:18px}.hub-video-media{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}.hub-video-backdrop{position:fixed;inset:0;background:#102030aa;z-index:90}.hub-player-expanded{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1100px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;z-index:91;margin:0}.hub-player-expanded .hub-video-media{max-height:calc(100vh - 100px)}.hub-editor{max-width:820px;background:white;border:1px solid #dce7ef;border-top:3px solid #098d75;padding:22px;border-radius:10px;margin:20px 0}.hub-editor label{display:block;margin:12px 0 6px;font-size:12px;font-weight:700}.hub-editor input,.hub-editor select,.hub-editor textarea{width:100%;padding:10px;border:1px solid #dce3ed;border-radius:6px}.hub-editor textarea{min-height:100px}button:focus-visible,a:focus-visible{outline:3px solid #65bbae;outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){header{padding:15px;flex-wrap:wrap}main{padding:0 15px}.intro h1{font-size:25px}.hub-list{grid-template-columns:1fr}}
</style></head><body><header><a href="/">Central de ligações</a><span id="viewerName"></span></header><main><section class="intro"><h1>Área de treinamentos</h1><p>Explore as aulas por produto e assista aqui, no seu ritmo.</p></section><div class="training-filters"><input id="trainingSearch" type="search" placeholder="Pesquisar treinamento" aria-label="Pesquisar treinamento"><select id="productFilter" aria-label="Filtrar por produto"><option value="">Todos os produtos</option></select><small id="trainingCount"></small></div><p id="pageStatus" role="status">Carregando seu acesso...</p><div id="hubHeader" hidden><button class="user-bell"></button></div><datalist id="productNames"></datalist></main><script src="/team-hub-client.js"></script><script src="/training-page.js"></script></body></html>
